<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WeatherOS — Meteorological Intelligence</title>
  <meta name="description" content="Minimalist Multilingual Weather Decision Support, IMD Extreme Alerts, Kisan Agromet Directives, Matsya Marine Safety, and 45-Year Climate Observatory." />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />

  <!-- Pre-render Theme Initialization (Zero Flash) -->
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
        if (t === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <!-- Google Fonts: Poppins & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            aj: {
              paper: '#fafafa',
              ink: '#171717',
              charcoal: '#111111',
              grey: '#666666',
              lightgrey: '#999999',
              rule: '#e5e5e5',
              darkrule: '#2a2a2a',
            }
          }
        }
      }
    }
  </script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- React 18 and Babel for JSX -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Custom Stylesheet with AJ Design Language -->
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="root">
    <!-- Initial minimalist loader -->
    <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
      <div style="text-align: center;">
        <div style="width: 24px; height: 24px; border: 2px solid var(--rule, #e5e5e5); border-top-color: var(--text, #000); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem;"></div>
        <h2 style="font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;">WeatherOS</h2>
        <p style="font-size: 0.72rem; color: var(--secondary, #666); margin-top: 0.25rem;">Meteorological Decision Intelligence</p>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Main Application Script -->
  <script type="text/babel" src="/static/app.js"></script>
</body>
</html>
